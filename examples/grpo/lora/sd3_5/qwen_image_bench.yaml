# GRPO LoRA — SD3.5-medium (T2I) scored by Qwen-Image-Bench (`qwen_image_bench`).
# Base config: examples/grpo/lora/sd3_5/nocfg.yaml (flow_grpo.pickscore_sd3_fast_nocfg).
#
# The reward is the Qwen-Image-Bench "Q-Judger" VLM, served REMOTELY via vLLM
# (OpenAI-compatible API), the same deployment pattern as rational_rewards_t2i.
# Setup:
#   1) pip install openai
#   2) Build the dataset: python dataset/qwen_image_bench/prepare.py  (writes train/test.jsonl)
#   3) Start the judge: ./scripts/start_vllm_qwen_image_bench.sh --max-model-len 32768
#   4) Set api_base_url to http://<judge-host>:<port>/v1 and align vlm_model with --served-model-name
#
# Dataset: Qwen/Qwen-Image-Bench (English prompts). Each row carries `dims_en`, so the
# reward runs FAITHFUL per-prompt scoring (the prompt's own facet list selects the L1
# dimensions); the `dimensions` list below is only a fallback for prompts without dims_en.
#
# NOTE on cost: `call_strategy: per_dimension` issues one judge call per L1 dimension
# per image (3-5 with this dataset), each generating thinking tokens. For cheaper runs,
# set `call_strategy: single_call`. `async_reward: true` overlaps judge latency with sampling.
# Caveat: training on the benchmark's own prompts and then evaluating on Qwen-Image-Bench
# is train/test contamination -- treat results accordingly.

# Environment Configuration
launcher: "accelerate"  # Options: accelerate
config_file: config/deepspeed/deepspeed_zero2.yaml  # Switch to config/accelerate_configs/fsdp2.yaml if you have limited GPU memory.
num_processes: 8  # Number of processes to launch (overrides config file)
main_process_port: 29500
mixed_precision: "bf16"  # Options: no, fp16, bf16

# Data Configuration
data:
  datasets:
    - name: qwen_image_bench  # Unique identifier (used in metrics, caching, reward routing)
      dataset_dir: "dataset/qwen_image_bench"  # Built by dataset/qwen_image_bench/prepare.py (train.jsonl / test.jsonl)
      train:  # Training participation config
        weight: 1  # Mixing weight (integer); ratio with other sources determines batch allocation
        max_dataset_size: 1000  # Cap on number of training samples (Qwen-Image-Bench has 1000 prompts)
      eval: {}  # Eval participation (inherits shared `eval:` section settings)
  preprocessing_batch_size: 8  # Batch size for preprocessing
  dataloader_num_workers: 16  # Number of workers for DataLoader
  force_reprocess: true  # Reprocess on first run after building the dataset (cache key does not hash file contents)
  cache_dir: "~/.cache/flow_factory/datasets" # Cache directory for preprocessed datasets
  sampler_type: "auto"  # Options: auto, distributed_k_repeat, group_contiguous

# Model Configuration
model:
  finetune_type: 'lora' # Options: full, lora
  lora_rank : 32
  lora_alpha : 64
  target_modules: "default" # Options: all, default, or list of module names like ["to_k", "to_q", "to_v", "to_out.0"]
  model_name_or_path: "stabilityai/stable-diffusion-3.5-medium"  # HuggingFace model ID or local path
  model_type: "sd3-5"
  resume_path: null # Local path or HF repo id (e.g. 'owner/repo[/subdir][@rev]') for previous checkpoint/lora adapter
  resume_type: null # Options: lora, full, state. Null to auto-detect based on `finetune_type`
  # attn_backend: '_flash_3_hub' # Attention backend for training.

log:
  run_name: null  # Run name (auto: {model_type}_{finetune_type}_{trainer_type}_{timestamp})
  project: "Flow-Factory"  # Project name for logging
  logging_backend: "wandb"  # Options: wandb, swanlab, tensorboard, none
  save_dir: "saves/"  # Directory to save model checkpoints and logs
  save_freq: 20  # Save frequency in epochs (0 to disable)
  save_model_only: true  # Save only the model weights (not optimizer, scheduler, etc.)

# Training Configuration
train:
  # Trainer settings
  trainer_type: 'grpo' # Options: 'grpo', 'nft', 'awm'
  advantage_aggregation: 'sum' # Options: 'sum', 'gdpo'
  # Clipping
  clip_range: 1.0e-4  # PPO/GRPO clipping range
  adv_clip_range: 5.0  # Advantage clipping range
  # KL div
  kl_type: 'v-based' # Options: 'x-based', 'v-based'
  kl_beta: 0 # KL divergence coefficient - 0 to disable and save memory. Set ~1e-2 for 'x-based' and ~1e-3 for 'v-based'.
  ref_param_device: 'cuda' # Options: cpu, cuda

  # Sampling settings
  resolution: 512  # Can be int or [height, width]
  num_inference_steps: 10  # Number of timesteps
  guidance_scale: 1.0  # Guidance scale for sampling

  # Batch and sampling
  per_device_batch_size: 8  # Batch size per device
  group_size: 18  # Group size for GRPO sampling
  global_std: true  # Use global std for advantage normalization
  unique_sample_num_per_epoch: 64  # Unique samples per group
  gradient_step_per_epoch: 2  # Gradient steps per epoch
  gradient_accumulation_steps: auto  # Options: auto, or positive integer. When set, `gradient_step_per_epoch` is ignored.

  # Optimization
  learning_rate: 3.0e-4  # Initial learning rate
  adam_weight_decay: 1.0e-4  # AdamW weight decay
  adam_betas: [0.9, 0.999]  # AdamW betas
  adam_epsilon: 1.0e-8  # AdamW epsilon
  max_grad_norm: 1.0  # Max gradient norm for clipping

  # EMA
  ema_decay: 0.99  # EMA decay rate (0 to disable)
  ema_update_interval: 4  # EMA update interval (in epochs)
  ema_device: "cuda"  # Device to store EMA model (options: cpu, cuda)

  # Gradient checkpointing
  enable_gradient_checkpointing: false  # Enable gradient checkpointing to save memory with extra compute

  # Seed
  seed: 42  # Random seed

# Scheduler Configuration
scheduler:
  dynamics_type: "CPS"  # Options: Flow-SDE, Dance-SDE, CPS, ODE (GRPO is coupled -> must use an SDE dynamics)
  noise_level: 0.8  # Noise level for sampling
  num_sde_steps: 3  # Number of noise steps
  sde_steps: [0, 1, 2, 3, 4]  # Custom noise window, noise steps are randomly selected from this list during training
  seed: 42  # Scheduler seed (for noise step selection)

# Evaluation settings
eval:
  resolution: 512  # Evaluation resolution
  per_device_batch_size: 8  # Eval batch size
  guidance_scale: 1.0  # Guidance scale for sampling
  num_inference_steps: 40  # Number of eval timesteps
  eval_freq: 20  # Eval frequency in epochs (0 to disable)
  seed: 42  # Eval seed

# Reward Model Configuration
# Qwen-Image-Bench judge over OpenAI-compatible HTTP (served by vLLM).
rewards:
  - name: "qwen_image_bench"
    reward_model: "qwen_image_bench"
    batch_size: 16
    device: "cuda"
    dtype: bfloat16
    async_reward: true  # IO-bound remote judge -> overlap reward computation with sampling
    num_workers: 8  # Concurrent in-flight images (async pointwise)
    # --- Remote judge (OpenAI-compatible) ---
    api_base_url: "http://127.0.0.1:8000/v1"  # Trailing /v1 required by AsyncOpenAI
    api_key: "EMPTY"
    vlm_model: "Qwen-Image-Bench"  # Must equal vLLM --served-model-name
    # --- Scoring behavior ---
    call_strategy: "per_dimension"  # Options: per_dimension (faithful, 1 call/L1 dim), single_call (cheaper)
    dimensions: ["Quality", "Aesthetics", "Alignment"]  # Fallback only; this dataset ships dims_en, so faithful per-prompt scoring is used
    score_dimension: "total"  # Options: total, or an L1 dim name (Quality/Aesthetics/Alignment/Real-world Fidelity/Creative Generation)
    # --- Concurrency / robustness ---
    max_concurrent: 64  # Max simultaneous API requests across all in-flight images
    max_retries: 5
    timeout: 300
    max_tokens: 4096  # Judge uses thinking; needs headroom

# Optional Evaluation Reward Models, default to all training reward models if not specified
eval_rewards:
  - name: "qwen_image_bench"
    reward_model: "qwen_image_bench"
    batch_size: 16
    device: "cuda"
    dtype: bfloat16
    async_reward: true
    num_workers: 8
    api_base_url: "http://127.0.0.1:8000/v1"
    api_key: "EMPTY"
    vlm_model: "Qwen-Image-Bench"
    call_strategy: "per_dimension"
    dimensions: ["Quality", "Aesthetics", "Alignment"]
    score_dimension: "total"
    max_concurrent: 64
    max_retries: 5
    timeout: 300
    max_tokens: 4096
